name: Deploy

on:
  push:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    if: "!contains(toJSON(github.event.commits.*.message), '[skip-ci]')"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      - uses: php-actions/composer@8a65f0d3c6a1d17ca4800491a40b5756a4c164f3 # v6.1.2

      - name: 'Checks'
        run: composer check

      - name: 'Tests'
        run: composer test

  build:
    runs-on: ubuntu-latest
    needs: [test]
    if: "!contains(toJSON(github.event.commits.*.message), '[skip-ci]')"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      - uses: php-actions/composer@8a65f0d3c6a1d17ca4800491a40b5756a4c164f3 # v6.1.2
        with:
          dev: no

      - name: Create dist forlder
        run: |
          cp -r src public static vendor db_admin migrations dist
          ls -R dist

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy via lftp
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PWD: ${{ secrets.FTP_PWD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          lftp -u "$FTP_USER","$FTP_PWD" \
            "$FTP_HOST" \
            -e "
              set ftp:ssl-force false;
              set ssl:verify-certificate false;
              mirror --reverse --parallel=10 --only-newer --continue --dereference -x ^\.git/$ ./dist id;
              chmod -R g+w id;
              quit
            "

  migrate:
    runs-on: ubuntu-latest
    needs: [build]
    if: "!contains(toJSON(github.event.commits.*.message), '[skip-ci]')"
    steps:
      - uses: actions/checkout@v4

      - name: Apply pending migrations
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $ADMIN_API_KEY" \
            "$APP_URL/admin/migrations/migrate"


  e2e:
    runs-on: ubuntu-latest
    needs: [migrate]
    if: "!contains(toJSON(github.event.commits.*.message), '[skip-ci]')"
    steps:
      - uses: actions/checkout@v4

      - name: E2E smoke test (Keycloak flow)
        run: |
          bash bin/e2e-test-keycloak.sh
        env:
          BASE_URL: ${{ secrets.APP_URL }}
          REALM: test
          CLIENT: kc_app
          REDIRECT_URI: https://www.keycloak.org/app
