name: Deploy

on:
  push:
    branches: [improvements]

jobs:
  test:
    runs-on: ubuntu-latest
    if: "!contains(toJSON(github.event.commits.*.message), '[skip-ci]')"
    steps:
      - uses: actions/checkout@v3

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      - uses: php-actions/composer@v6

      - name: 'Checks'
        run: composer check

      - name: 'Tests'
        run: composer test

  build:
    runs-on: ubuntu-latest
    needs: [test]
    if: "!contains(toJSON(github.event.commits.*.message), '[skip-ci]')"
    steps:
      - uses: actions/checkout@v3

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      - uses: php-actions/composer@v6
        with:
          dev: no

      - name: Create dist forlder
        run: |
          mkdir -p ./dist/config && cp -r src public static vendor db_admin dist && cp config/di.php dist/config/
          ls -R dist

      - name: Deploy via lftp
        run: |
          lftp -u "${{ secrets.FTP_USER }}","${{ secrets.FTP_PWD }}" \
            "${{ secrets.FTP_HOST }}" \
            -e "
              set ftp:ssl-force false;
              set ssl:verify-certificate false;
              mirror --reverse --parallel=10 --only-newer --continue --dereference -x ^\.git/$ ./dist id;
              chmod -R g+w id;
              quit
            "

      - name: Apply pending migrations
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.ADMIN_API_KEY }}" \
            "https://${{ secrets.FTP_HOST }}/id/db/migrations/migrate"
