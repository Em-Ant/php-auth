name: Deploy

on:
  push:
    branches: [improvements]

jobs:
  test:
    runs-on: ubuntu-latest
    if: "!contains(toJSON(github.event.commits.*.message), '[skip-ci]')"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      - uses: php-actions/composer@v6

      - name: 'Checks'
        run: composer check

      - name: 'Tests'
        run: composer test

  build:
    runs-on: ubuntu-latest
    needs: [test]
    if: "!contains(toJSON(github.event.commits.*.message), '[skip-ci]')"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      - uses: php-actions/composer@v6
        with:
          dev: no

      - name: Create dist forlder
        run: |
          mkdir -p ./dist/config && cp -r src public static vendor db_admin dist && cp config/di.php dist/config/
          ls -R dist

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy via lftp
        run: |
          lftp -u "${{ secrets.FTP_USER }}","${{ secrets.FTP_PWD }}" \
            "${{ secrets.FTP_HOST }}" \
            -e "
              set ftp:ssl-force false;
              set ssl:verify-certificate false;
              mirror --reverse --parallel=10 --only-newer --continue --dereference -x ^\.git/$ ./dist id;
              chmod -R g+w id;
              quit
            "

  migrate:
    runs-on: ubuntu-latest
    needs: [build]
    if: "!contains(toJSON(github.event.commits.*.message), '[skip-ci]')"
    steps:
      - uses: actions/checkout@v4

      - name: Apply pending migrations
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.ADMIN_API_KEY }}" \
            "${{ secrets.APP_URL }}/db/migrations/migrate"


  e2e:
    runs-on: ubuntu-latest
    needs: [migrate]
    if: "!contains(toJSON(github.event.commits.*.message), '[skip-ci]')"
    steps:
      - uses: actions/checkout@v4

      - name: E2E smoke test (Keycloak flow)
        run: |
          bash bin/e2e-test-keycloak.sh
        env:
          BASE_URL: ${{ secrets.APP_URL }}
          REALM: test
          CLIENT: kc_app
          REDIRECT_URI: https://www.keycloak.org/app


